---
# Codacy repository configuration.
# Reference: https://docs.codacy.com/repositories-configure/codacy-configuration-file/
# With this file present, path exclusions for Codacy analysis are managed
# here instead of the repository settings UI.

exclude_paths:
  # Generated by Cargo; content and formatting are tool-owned and line
  # counts carry no analysis signal.
  - "Cargo.lock"
  # Package manifests carry no analyzable source; the npm dependency
  # checker flags the typescript devDependency there, which is the
  # project's own pinned toolchain choice.
  - "sdk/typescript/package.json"

engines:
  lizard:
    # Lizard's Rust parser desyncs on some inputs and attributes hundreds
    # of phantom NLOC to small functions in the files below. Verified
    # against lizard 1.24.0 (the measurement engine Codacy's Lizard tool
    # wraps) with an independent brace-aware counter: the 7-line
    # `o_series` measures 301 NLOC, the 17-line `decode_windows1252`
    # measures 453, the 9-line `kill_and_yank_roundtrip` measures 286,
    # the 15-line `validate_snapshot_label` measures 251. The same files
    # re-measure differently after unrelated nearby edits, so no source
    # change can stabilize them. Findings from this tool on these files
    # carry no signal until the upstream parser is fixed; the files stay
    # covered by every other tool.
    exclude_paths:
      - "crates/capabilities/tools/src/fs/mod.rs"
      - "crates/capabilities/tools/src/web_fetch.rs"
      # pooled_call and run_lsp_call take `impl AsyncFnOnce(...)` closure
      # parameters; the parser counts the closure's argument types as
      # function parameters (6 real, 9 reported).
      - "crates/capabilities/tools/src/lsp/providers.rs"
      - "crates/foundation/llm/src/openai.rs"
      - "crates/frontends/console/src/dialogs/model_wizard.rs"
      - "crates/frontends/console/src/dialogs/tests.rs"
      - "crates/frontends/console/src/ui/tests_commands.rs"
      - "crates/frontends/console/src/ui/vt_repro.rs"
      - "crates/frontends/console/src/ui.rs"
      - "crates/frontends/engine/src/editor.rs"
      - "crates/frontends/engine/src/editor/tests.rs"
      - "crates/frontends/engine/src/mermaid/tests.rs"
      - "crates/frontends/harness/src/update.rs"
      - "crates/state/checkpoint/src/snapshot.rs"
      - "crates/state/persistence/src/sessions.rs"
