# Dependabot configuration.
#
# Every "uses:" in the workflows is pinned to a full commit SHA, and the
# github-actions entry is what keeps those pins current without anyone
# hand-editing them. Rust and Node versions are NOT Dependabot's business:
# they live in the workflows as explicit inputs (toolchain:, node-version:)
# and move only as a deliberate change — the msrv leg is a gate, and a
# lexical "newest version branch" bump once broke every Rust job at once.
#
# Updates are grouped so the required-approval flow stays reviewable.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-rs)"
    labels:
      - "dependencies"
      - "rust"
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-js)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm:
        patterns: ["*"]
    # @types/node must track the Node major that CI actually runs (24,
    # the active LTS). Lift this when the workflows move to Node 26.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
