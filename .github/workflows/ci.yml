name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same ref should not keep the previous full
# matrix running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # rustfmt is host-independent. One leg is enough, and it does not
  # need a dependency build.
  changes:
    # Fail-open docs triage: only markdown/LICENSE-only diffs skip the heavy
    # suites; anything unrecognized counts as code and runs everything.
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          docs_only=true
          while IFS= read -r f; do
            case "$f" in
              *.md|LICENSE|.gitignore|.gitattributes|docs/*) ;;
              *) docs_only=false ;;
            esac
          done < <(git diff --name-only "$BASE...HEAD")
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  fmt:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain is an explicit input, not the action ref: newer
      # revisions of dtolnay/rust-toolchain require it, and keeping it
      # here lets Dependabot bump the action without touching Rust.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - run: cargo fmt --all --check

  # Real MSRV (verified: locked tree-sitter 0.27 needs 1.90). A check
  # rather than the full test suite keeps this leg fast — the 1.99
  # legs carry clippy and the tests.
  msrv:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv-1.90.0
          cache-on-failure: true
      - run: cargo check --workspace --locked

  supply-chain:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  # The PR title becomes the squash-merge commit message, so it must
  # already satisfy the repo's Conventional Commits rule.
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title against Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|refactor|chore|test|perf)(\([a-z0-9-]+\))?: .{1,72}$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "PR title does not match Conventional Commits: $TITLE"
            echo "Expected: <type>: <subject> — type one of feat/fix/docs/refactor/chore/test/perf,"
            echo "subject 72 characters or fewer. Acronyms stay allowed."
            exit 1
          fi
          if [[ "$TITLE" =~ P[0-9] ]]; then
            echo "PR title carries an internal phase number: $TITLE"
            exit 1
          fi

  # Clippy and tests stay per OS: cfg-gated Windows and macOS code is
  # not compiled on Ubuntu. Fmt and the TypeScript SDK are not here.
  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # `cargo test` builds the harness, not `target/debug/wavecode`.
      - run: cargo build --locked --bin wavecode
      - name: E2E smoke (binary boots, MCP protocol answers)
        shell: bash
        run: |
          set -euo pipefail
          bin="target/debug/wavecode"
          if [[ "$RUNNER_OS" == "Windows" ]]; then bin="target/debug/wavecode.exe"; fi
          test -f "$bin"
          "$bin" --version | grep -q wavecode
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | "$bin" mcp serve | grep -q '"serverInfo"'
          "$bin" plugin list | grep -q "no plugins installed"

  # The SDK smoke skips live turns unless WAVECODE_SDK_LIVE=1, so this
  # leg only typechecks and runs the node:test file. One OS is enough.
  sdk:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  docs:
    # docs/ ships as X.md + X.zh.md pairs; a page landing in one language
    # only would orphan readers of the other. AGENTS/CLAUDE/CHANGELOG and
    # the root policy files are single-language by convention (skip list
    # in the script).
    name: docs bilingual pairs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/ci/check_docs_pairs.py

  gate:
    # Merge-time summary: branch protection requires this check. Always runs;
    # passes when every job that ran succeeded (skipped areas are fine) and
    # fails on any failure or cancellation, so a cancelled run can never
    # masquerade as green. Future jobs join the needs list; the
    # required-checks entry never changes.
    name: gate
    needs: [changes, fmt, msrv, supply-chain, title, test, sdk, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate gate results
        env:
          CHANGES: ${{ needs.changes.result }}
          FMT: ${{ needs.fmt.result }}
          MSRV: ${{ needs.msrv.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
          TITLE: ${{ needs.title.result }}
          TEST: ${{ needs.test.result }}
          SDK: ${{ needs.sdk.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          set -euo pipefail
          results="changes=$CHANGES fmt=$FMT msrv=$MSRV supply_chain=$SUPPLY_CHAIN title=$TITLE test=$TEST sdk=$SDK docs=$DOCS"
          echo "$results"
          if grep -qE '=(failure|cancelled)' <<< "$results"; then
            echo "::error::one or more gates failed or were cancelled"
            exit 1
          fi
          echo "all triggered gates passed"
