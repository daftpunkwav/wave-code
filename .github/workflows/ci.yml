name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          # Live PTY tests stay opt-in on Windows so a ConPTY-broken host
          # cannot leak a spinning conhost per test run; CI runners are
          # ephemeral, so the coverage is safe to turn on here. Unix legs run
          # them by default.
          WAVECODE_PTY_TESTS: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      - name: E2E smoke (binary boots, MCP protocol answers)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --bin wavecode
          bin="target/debug/wavecode"
          if [[ "$RUNNER_OS" == "Windows" ]]; then bin="target/debug/wavecode.exe"; fi
          "$bin" --version | grep -q wavecode
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | "$bin" mcp serve | grep -q '"serverInfo"'
          "$bin" plugin list | grep -q "no plugins installed"
      - name: SDK build and smoke (real binary)
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SDK build and test
        working-directory: sdk/typescript
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
          pnpm test
