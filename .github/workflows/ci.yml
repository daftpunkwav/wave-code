name: ci

on:
  push:
    branches: [main]
  pull_request:

  # Real MSRV (verified: locked tree-sitter 0.27 needs 1.90); a check
  # rather than the full test suite keeps this leg fast — the stable
  # legs carry the tests.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The PR title becomes the squash-merge commit message, so it must
  # already satisfy the repo's Conventional Commits rule.
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PR title against Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|refactor|chore|test|perf)(\([a-z0-9-]+\))?: .{1,50}$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "PR title does not match Conventional Commits: $TITLE"
            echo "Expected: <type>: <subject> — type one of feat/fix/docs/refactor/chore/test/perf,"
            echo "subject 50 characters or fewer. Acronyms stay allowed."
            exit 1
          fi
          if [[ "$TITLE" =~ P[0-9] ]]; then
            echo "PR title carries an internal phase number: $TITLE"
            exit 1
          fi

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: E2E smoke (binary boots, MCP protocol answers)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --bin wavecode
          bin="target/debug/wavecode"
          if [[ "$RUNNER_OS" == "Windows" ]]; then bin="target/debug/wavecode.exe"; fi
          "$bin" --version | grep -q wavecode
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | "$bin" mcp serve | grep -q '"serverInfo"'
          "$bin" plugin list | grep -q "no plugins installed"
      - name: SDK build and smoke (real binary)
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SDK build and test
        working-directory: sdk/typescript
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
          pnpm test
