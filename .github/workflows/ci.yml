name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same ref should not keep the previous full
# matrix running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # rustfmt is host-independent. One leg is enough, and it does not
  # need a dependency build.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Real MSRV (verified: locked tree-sitter 0.27 needs 1.90). A check
  # rather than the full test suite keeps this leg fast — the 1.98
  # legs carry clippy and the tests.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv-1.90.0
          cache-on-failure: true
      - run: cargo check --workspace --locked

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  # The PR title becomes the squash-merge commit message, so it must
  # already satisfy the repo's Conventional Commits rule.
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title against Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|refactor|chore|test|perf)(\([a-z0-9-]+\))?: .{1,50}$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "PR title does not match Conventional Commits: $TITLE"
            echo "Expected: <type>: <subject> — type one of feat/fix/docs/refactor/chore/test/perf,"
            echo "subject 50 characters or fewer. Acronyms stay allowed."
            exit 1
          fi
          if [[ "$TITLE" =~ P[0-9] ]]; then
            echo "PR title carries an internal phase number: $TITLE"
            exit 1
          fi

  # Clippy and tests stay per OS: cfg-gated Windows and macOS code is
  # not compiled on Ubuntu. Fmt and the TypeScript SDK are not here.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # `cargo test` builds the harness, not `target/debug/wavecode`.
      - run: cargo build --locked --bin wavecode
      - name: E2E smoke (binary boots, MCP protocol answers)
        shell: bash
        run: |
          set -euo pipefail
          bin="target/debug/wavecode"
          if [[ "$RUNNER_OS" == "Windows" ]]; then bin="target/debug/wavecode.exe"; fi
          test -f "$bin"
          "$bin" --version | grep -q wavecode
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | "$bin" mcp serve | grep -q '"serverInfo"'
          "$bin" plugin list | grep -q "no plugins installed"

  # The SDK smoke skips live turns unless WAVECODE_SDK_LIVE=1, so this
  # leg only typechecks and runs the node:test file. One OS is enough.
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test
