[workspace]
resolver = "3"
# Explicit member list: Dependabot's cargo updater parses the manifest with
# its own TOML reader, which does not expand glob patterns, and then fails
# `cargo metadata` inside its checkout (the weekly "Dependabot Updates" run
# on main has been failing for exactly this reason). New crates must be
# added here.
members = [
    "crates/action/browser",
    "crates/action/jobs",
    "crates/action/retrieval",
    "crates/action/tasks",
    "crates/action/workflow",
    "crates/capabilities/context",
    "crates/capabilities/hooks",
    "crates/capabilities/mcp",
    "crates/capabilities/memory",
    "crates/capabilities/sandbox",
    "crates/capabilities/skills",
    "crates/capabilities/tools",
    "crates/foundation/auth",
    "crates/foundation/config",
    "crates/foundation/llm",
    "crates/foundation/protocol",
    "crates/foundation/wire",
    "crates/frontends/console",
    "crates/frontends/engine",
    "crates/frontends/harness",
    "crates/infrastructure/base",
    "crates/infrastructure/ratelimit",
    "crates/operations/actor",
    "crates/operations/bootstrap",
    "crates/operations/eval",
    "crates/operations/gateway",
    "crates/operations/observe",
    "crates/operations/simulate",
    "crates/runtime/child",
    "crates/runtime/plugin",
    "crates/runtime/prompt",
    "crates/runtime/runner",
    "crates/runtime/scheduler",
    "crates/safety/audit",
    "crates/safety/gate",
    "crates/safety/guardrail",
    "crates/safety/secrets",
    "crates/state/artifact",
    "crates/state/checkpoint",
    "crates/state/goal",
    "crates/state/persistence",
    "crates/state/plan",
    "crates/state/store",
    "crates/transport/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Real MSRV, verified with `cargo +1.90 check --workspace --locked`:
# the locked tree-sitter 0.27 / tree-sitter-language 0.1.8 need 1.90.
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Frontmatter deserialization only; `serialize` stays off so the YAML
# emitter dependencies never enter the tree. `serde-saphyr` parses YAML in
# safe Rust, unlike the archived `serde_yaml` -> `unsafe-libyaml` chain
# (RUSTSEC-2024-0449).
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
# "full" is deliberate: the workspace-wide union needs process, signal, net,
# io, fs, time, sync and the multi-threaded runtime, so per-crate trimming
# collapses to the same feature set once features unify across the build.
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
clap = { version = "4", features = ["derive"] }
rustyline = "17"
toml = "1.2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
tempfile = "3"
bytes = "1"
base64 = "0.23"
regex = "1"
glob = "0.3"
# App server: HTTP+SSE over tokio (matches the workspace's async stack).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
# Parser/Event API only: the `html` renderer and its `getopts` CLI
# parsing default are unused, so both stay out of the build.
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
unicode-segmentation = "1"
libc = "0.2"
landlock = "0.4"
# POSIX ACL preservation across the self-update binary swap: `std::fs`
# exposes only mode bits, while on Linux the access ACL is a
# kernel-managed xattr (`system.posix_acl_access`).
xattr = "1"
# Console code-page fallback for child-process output decoding: the
# `cmd` builtins emit the ANSI code page, not UTF-8.
encoding_rs = "0.8"
windows-sys = "0.61"
# TUI rendering is the in-house tui-engine over crossterm (no ratatui);
# crossterm's event-stream + bracketed-paste features are both in use.
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
# Syntax highlighting for code blocks (syntect on the pure-Rust
# fancy-regex backend, no onig C dependency) plus extra syntax
# definitions (TypeScript, TOML, ...) on the same backend.
# The feature list is `default-fancy` without `yaml-load`: the console
# reads the bundled binary dumps and one bundled tmTheme, never a YAML
# grammar, and `yaml-load` is the only path that pulls the unmaintained
# yaml-rust (RUSTSEC-2024-0320) into the tree.
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "html",
    "plist-load",
    "dump-load",
    "dump-create",
    "regex-fancy",
] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# Release profile for the shipped binary: thin LTO + one codegen unit
# for size/speed, symbols stripped from the distributed artifact.
# `panic` stays `unwind` on purpose — the child runtime isolates tool
# panics through catch_unwind, which abort would disable.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
