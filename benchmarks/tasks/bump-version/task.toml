id = "bump-version"
prompt = """Release 1.4.0: update every place in this workspace that states the version. Leave names and structure alone."""
fixture = "workspace"
tags = ["multi-file", "consistency"]

[[assertion]]
kind = "file_contains"
path = "docs/install.md"
text = "1.4.0"

[[assertion]]
kind = "file_not_contains"
path = "docs/install.md"
text = "1.3.0"

[[assertion]]
kind = "file_contains"
path = "src/lib.rs"
text = 'VERSION: &str = "1.4.0"'

[[assertion]]
kind = "file_contains"
path = "Cargo.toml"
text = 'version = "1.4.0"'

[[assertion]]
kind = "command"
program = "cargo"
args = ["build", "--offline"]
timeout_secs = 300
