[package]
name = "wavecode-mcp"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# The interface boundary (traits, types, naming, config) is self-contained;
# the client bridge additionally leans on the transports, the tool trait,
# and the config vocabulary.
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
transport-mcp = { path = "../../transport/mcp" }
wavecode-config = { path = "../../foundation/config" }
wavecode-tools = { path = "../tools" }

[dev-dependencies]
# Test-only: reuse the transport's hand-rolled HTTP stub instead of a
# second private copy (the feature compiles test_support solely for tests).
transport-mcp = { path = "../../transport/mcp", features = ["test-support"] }
