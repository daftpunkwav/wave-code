[package]
name = "wavecode-memory"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# The `tool` module persists explicit writes through the shared Tool
# trait; the async runtime bridges the small filesystem writes off the
# executor (same-tier wavecode-tools edge, like wavecode-mcp).
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Owner-only file writes for the memory store under `~/.wavecode/memories`.
infrastructure-base = { path = "../../infrastructure/base" }
wavecode-tools = { path = "../tools" }

[dev-dependencies]
tempfile.workspace = true
