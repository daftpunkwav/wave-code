[package]
name = "wavecode-sandbox"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# PermissionMode / ApprovalKind are protocol types (the SPEC section 3 matrix
# already records this edge).
wavecode-protocol = { path = "../../foundation/protocol" }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The tool-name classification lock test mirrors the tools builtin set
# (capabilities production sides do not depend on each other, so tool names
# cannot be bound at compile time — locked by a dev-dep test instead, which
# fails when a tool is renamed or added).
wavecode-tools = { path = "../tools" }
