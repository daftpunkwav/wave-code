[package]
name = "wavecode-sandbox"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# PermissionMode / ApprovalKind are protocol types (the SPEC section 3 matrix
# already records this edge).
wavecode-protocol = { path = "../../foundation/protocol" }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# Win32 Job-Object FFI for the partial Windows backend (`windows.rs`): the
# lighter `windows-sys` (raw bindings, no COM runtime) over the heavier
# `windows` crate, with only the features the backend needs.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    # CreateJobObjectW's signature takes SECURITY_ATTRIBUTES, so the
    # symbol itself is gated on the Win32_Security feature even though
    # no code path names the Win32::Security module.
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
tempfile.workspace = true
# The tool-name classification lock test mirrors the tools builtin set.
# (History: capabilities sides once had no cross-dependencies, so tool names
# were locked by a dev-dep test; tools now depends on this crate in
# production, but the lock test still guards renames of the classifier
# vocabulary.)
wavecode-tools = { path = "../tools" }
