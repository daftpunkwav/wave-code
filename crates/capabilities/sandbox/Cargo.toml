[package]
name = "wavecode-sandbox"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# PermissionMode / ApprovalKind 是 protocol 线型（SPEC §3 矩阵已补录此边）
wavecode-protocol = { path = "../../foundation/protocol" }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# 工具名分类锁定测试对照 tools 内置集（capabilities 生产边互不依赖，无法
# 编译期绑定工具名——以 dev-dep 测试锁定，工具改名/新增时测试失败）
wavecode-tools = { path = "../tools" }
