[package]
name = "wavecode-sandbox"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# PermissionMode / ApprovalKind are protocol types (the SPEC section 3 matrix
# already records this edge).
wavecode-protocol = { path = "../../foundation/protocol" }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
# Win32 Job-Object FFI for the partial Windows backend (`windows.rs`): the
# lighter `windows-sys` (raw bindings, no COMruntime) over the heavier
# `windows` crate, with only the features the backend needs.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
tempfile.workspace = true
# The tool-name classification lock test mirrors the tools builtin set
# (capabilities production sides do not depend on each other, so tool names
# cannot be bound at compile time — locked by a dev-dep test instead, which
# fails when a tool is renamed or added).
wavecode-tools = { path = "../tools" }
