[package]
name = "wavecode-tools"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# Shared platform-shell resolution (shell_invocation) for command strings.
infrastructure-base = { path = "../../infrastructure/base" }
# The delegation tools (`task*`) spawn children through this
# capability-neutral seam (a zero-dependency vocabulary-tier crate).
action-tasks = { path = "../../action/tasks" }
# `ToolKind`: the declarative policy class the `Tool` trait carries so
# the sandbox never matches on tool names (architecture rule 4).
wavecode-protocol = { path = "../../foundation/protocol" }
wavecode-sandbox = { path = "../sandbox" }
wavecode-llm = { path = "../../foundation/llm" }
wavecode-context = { path = "../context" }
base64.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
regex.workspace = true
glob.workspace = true
# Console code-page fallback for child-output decoding (GBK `dir`
# output and friends that plain UTF-8 lossy turns into U+FFFD noise).
encoding_rs.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# GetACP() for the fallback decoder below; raw bindings like the
# sandbox backend use.
windows-sys = { workspace = true, features = ["Win32_Globalization"] }

[dev-dependencies]
tempfile.workspace = true
