[package]
name = "wavecode-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "wavecode"
path = "src/main.rs"

[dependencies]
# Assembly is split during migration: the interactive TUI path assembles
# through operations-bootstrap (new harness engine); exec, REPL, and
# resume still use the legacy core assembly until their ports land.
operations-bootstrap = { path = "../../operations/bootstrap" }
wavecode-protocol = { path = "../../foundation/protocol" }
wavecode-config = { path = "../../foundation/config" }
wavecode-core = { path = "../../engine/core" }
wavecode-app-server = { path = "../../transport/app-server" }
# TTY default path enters the ratatui TUI (cli→tui edge).
wavecode-tui = { path = "../../frontends/tui" }
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustyline.workspace = true
anstream.workspace = true
anstyle.workspace = true
pulldown-cmark.workspace = true
terminal_size.workspace = true
unicode-width.workspace = true

[dev-dependencies]
tempfile.workspace = true
