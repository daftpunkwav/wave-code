[package]
name = "wavecode-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "wavecode"
path = "src/main.rs"

[dependencies]
# 装配根已收口 core::assemble（SPEC §3 矩阵 cli 行）：cli 不再直连
# llm / tools / sandbox / memory / skills 等 capabilities/foundation crate，
# 一切装配知识经 core 的 SessionConfig / Boot 到达。
wavecode-protocol = { path = "../../foundation/protocol" }
wavecode-config = { path = "../../foundation/config" }
wavecode-core = { path = "../../engine/core" }
wavecode-app-server = { path = "../../transport/app-server" }
# P8：TTY 默认路径进入 ratatui TUI（SPEC §3 矩阵允许 cli→tui）
wavecode-tui = { path = "../../frontends/tui" }
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustyline.workspace = true
anstream.workspace = true
anstyle.workspace = true
pulldown-cmark.workspace = true
terminal_size.workspace = true
unicode-width.workspace = true

[dev-dependencies]
tempfile.workspace = true
