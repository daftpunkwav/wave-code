[package]
name = "console-ui"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

# Boundary: the console UI consumes the session exclusively through the
# wire protocol and the actor client, with rendering delegated to
# tui-engine. Session identity/journaling for the pickers rides
# state-persistence; user paths resolve through the shared
# wavecode-config home definition; permission-mode vocabulary (mode
# cycle, aliases) comes from wavecode-protocol. Internal dependencies
# are exactly those six; tests::dependency_matrix_locked locks the set.
[dependencies]
tui-engine = { path = "../engine" }
wavecode-wire = { path = "../../foundation/wire" }
wavecode-protocol = { path = "../../foundation/protocol" }
wavecode-config = { path = "../../foundation/config" }
operations-actor = { path = "../../operations/actor" }
state-persistence = { path = "../../state/persistence" }
async-trait.workspace = true
crossterm.workspace = true
tokio.workspace = true
futures.workspace = true
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
anyhow.workspace = true
base64.workspace = true
# Syntax highlighting versions and features are unified at the workspace
# root (syntect on the pure-Rust fancy-regex backend, no onig C
# dependency; two-face adds extra syntax definitions on the same backend).
syntect.workspace = true
two-face.workspace = true

[dev-dependencies]
tempfile.workspace = true
