[package]
name = "console-ui"
edition.workspace = true
version.workspace = true
license.workspace = true

# Boundary: the console UI consumes the session exclusively through the
# wire protocol and the actor client, with rendering delegated to
# tui-engine. Session identity/journaling for the pickers rides
# state-persistence. Internal dependencies are exactly those four; tests::
# dependency_matrix_locked locks the set.
[dependencies]
tui-engine = { path = "../engine" }
wavecode-wire = { path = "../../foundation/wire" }
operations-actor = { path = "../../operations/actor" }
state-persistence = { path = "../../state/persistence" }
async-trait.workspace = true
crossterm.workspace = true
tokio.workspace = true
futures.workspace = true
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
anyhow.workspace = true
base64.workspace = true
# Syntax highlighting for code blocks (pure-Rust fancy-regex backend,
# no onig C dependency).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Extra syntax definitions (TypeScript, TOML, ...) on the same
# fancy-regex backend.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
tempfile.workspace = true
