[package]
name = "harness-cli"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "wavecode"
path = "src/main.rs"

[dependencies]
infrastructure-base = { path = "../../infrastructure/base" }
operations-actor = { path = "../../operations/actor" }
operations-bootstrap = { path = "../../operations/bootstrap" }
operations-gateway = { path = "../../operations/gateway" }
operations-eval = { path = "../../operations/eval" }
operations-observe = { path = "../../operations/observe" }
wavecode-wire = { path = "../../foundation/wire" }
wavecode-protocol = { path = "../../foundation/protocol" }
state-persistence = { path = "../../state/persistence" }
wavecode-config = { path = "../../foundation/config" }
console-ui = { path = "../console" }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
reqwest.workspace = true
rustyline.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
sha2.workspace = true

# ACL preservation in the self-update swap: Linux carries the access
# ACL in a kernel xattr; macOS needs libc for the libSystem ACL API.
[target.'cfg(target_os = "linux")'.dependencies]
xattr.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

# Linux tests assert against the errno values the ACL probe maps on.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
