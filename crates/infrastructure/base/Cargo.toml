[package]
name = "infrastructure-base"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# The off-worker tree-kill helper runs the blocking `taskkill` wait on
# the tokio blocking pool, so the crate carries the runtime it needs to
# hand the work over.
tokio.workspace = true
# Process-group kill for `kill_tree` (Unix only; Windows routes through
# `taskkill`, other platforms degrade to a no-op).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
