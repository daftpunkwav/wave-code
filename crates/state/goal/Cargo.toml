[package]
name = "state-goal"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# Crash-safe file replace (`atomic_write`) for the durable goal file.
infrastructure-base = { path = "../../infrastructure/base" }
# The `tool` module renders the machine model-invokable via the shared
# Tool trait; the async runtime bridges persistence off the executor.
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# ToolKind: the declarative policy class the goal tool claims.
wavecode-protocol = { path = "../../foundation/protocol" }
wavecode-tools = { path = "../../capabilities/tools" }

[dev-dependencies]
tempfile.workspace = true
