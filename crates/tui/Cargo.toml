[package]
name = "wavecode-tui"
edition.workspace = true
version.workspace = true
license.workspace = true

# SPEC §3 边界规则 2：tui 只允许依赖 protocol + app-server（进程内 transport），
# 不得依赖 core——本表即依赖断言的事实源，crates/tui/src/lib.rs 的
# dependency_matrix_locked 测试在测试层锁定（新增 wavecode-* 依赖即红）。
[dependencies]
wavecode-protocol = { path = "../protocol" }
wavecode-app-server = { path = "../app-server" }
ratatui.workspace = true
crossterm.workspace = true
tokio.workspace = true
futures.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
unicode-width.workspace = true
uuid.workspace = true
anyhow.workspace = true
